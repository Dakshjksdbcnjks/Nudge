<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nudge</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #FFFCF7;
      color: #1C1410;
    }
    .popup-header { background: #1C1410; padding: 18px 20px 16px; }
    .popup-logo { font-size: 22px; font-weight: 700; color: white; letter-spacing: -0.02em; }
    .popup-logo span { color: #D4663A; }
    .popup-tagline { font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 2px; }
    .popup-body { padding: 16px 20px; }
    .popup-desc { font-size: 14px; color: #6B5C52; line-height: 1.55; margin-bottom: 16px; }
    .popup-btn {
      display: block; width: 100%; background: #D4663A; color: white;
      border: none; border-radius: 10px; padding: 12px;
      font-size: 15px; font-weight: 600; cursor: pointer;
      font-family: inherit; text-align: center; margin-bottom: 8px;
      transition: background 0.15s ease;
    }
    .popup-btn:hover { background: #BF5A32; }
    .popup-btn-outline { background: none; border: 1.5px solid #EDE6DC; color: #6B5C52; }
    .popup-btn-outline:hover { background: #FFF7EE; border-color: #D4663A; color: #D4663A; }
    .popup-footer { border-top: 1px solid #EDE6DC; padding: 10px 20px; font-size: 11px; color: #A39088; text-align: center; }
    .opened-msg { font-size: 12px; color: #2D6A4F; background: #EBF5F0; border-radius: 8px; padding: 8px 12px; margin-top: 8px; display: none; text-align: center; }
  </style>
</head>
<body>
  <div class="popup-header">
    <div class="popup-logo">nudge<span>.</span></div>
    <div class="popup-tagline">Know before you buy</div>
  </div>
  <div class="popup-body">
    <p class="popup-desc">
      See the <strong>real cost</strong> of any purchase — after interest, in hours worked, and future wealth lost.
    </p>
    <button class="popup-btn" id="btn-calc">💳 Check a purchase</button>
    <button class="popup-btn popup-btn-outline" id="btn-debt">🗺️ Get my debt plan</button>
    <div class="opened-msg" id="opened-msg">Opening nudge in a new tab ✓</div>
  </div>
  <div class="popup-footer">nudge. — Divergent IT Hackathon 2025</div>

  <script src="popup.js"></script>
</body>
</html>
